syntax = "proto3";

package pairing.v1;

option go_package = "tournament-engine/pkg/proto/pairing/v1;pairingv1";

message Player {
  string player_id = 1;
  int32 score = 2;
  repeated string avoided_opponents = 3;
  int32 white_count = 4;
  int32 black_count = 5;
  string last_color = 6;
  bool received_bye = 7;
}

message Match {
  string match_id = 1;
  string white_player_id = 2;
  string black_player_id = 3;
  int32 board_number = 4;
}

message PairingRequest {
  string tournament_id = 1;
  int32 round = 2;
  repeated Player players = 3;
}

message PairingResponse {
  bool success = 1;
  repeated Match matches = 2;
  string error_message = 3;
  string bye_player_id = 4;
}

service PairingService {
  rpc GeneratePairings(PairingRequest) returns (PairingResponse);
}
